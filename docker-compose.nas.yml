services:
  app:
    build:
      context: .
    container_name: gestiio-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8090:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://gestiio.agenziaplinio.it
      SESSION_SECURE_COOKIE: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: u427445037_gestiio
      DB_USERNAME: u427445037_gestiio
      DB_PASSWORD: ${DB_PASSWORD}
      # Temporaneo: file/database finché l'immagine non include predis/phpredis.
      # Redis resta disponibile per un ripristino successivo (REDIS_*).
      CACHE_DRIVER: file
      QUEUE_CONNECTION: database
      REDIS_CLIENT: predis
      REDIS_HOST: gestiio-redis
      REDIS_PORT: 6379
      STRIPE_KEY: ${STRIPE_KEY}
      STRIPE_PUBLIC_KEY: ${STRIPE_KEY}
      STRIPE_SECRET: ${STRIPE_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      N8N_AUTOMATION_ENABLED: "true"
      N8N_GESTIIO_WEBHOOK_URL: http://n8n:5678/webhook/gestiio-ai
      N8N_GESTIIO_WEBHOOK_SECRET: ${N8N_GESTIIO_WEBHOOK_SECRET}
      N8N_GESTIIO_CALLBACK_SECRET: ${N8N_GESTIIO_CALLBACK_SECRET}
      N8N_GESTIIO_TIMEOUT: ${N8N_GESTIIO_TIMEOUT:-12}
    volumes:
      - gestiio_storage:/var/www/html/storage
    networks:
      - default
      - proxy_network

  db:
    image: mariadb:11.8
    container_name: gestiio-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: u427445037_gestiio
      MARIADB_USER: u427445037_gestiio
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - gestiio_db:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: gestiio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - gestiio_redis:/data

volumes:
  gestiio_db:
  gestiio_storage:
  gestiio_redis:

networks:
  proxy_network:
    external: true
