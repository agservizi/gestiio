<VirtualHost *:80>
    ServerName gestiio.agenziaplinio.it
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gestiio-error.log
    CustomLog ${APACHE_LOG_DIR}/gestiio-access.log combined
</VirtualHost>
