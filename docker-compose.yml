version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gestiio-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=gestiio
      - DB_USERNAME=gestiio
      - DB_PASSWORD=GestiioNas2024!
    networks:
      - gestiio-net

  nginx:
    image: nginx:alpine
    container_name: gestiio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gestiio-net

  db:
    image: mariadb:10.11
    container_name: gestiio-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: GestiioRoot2024!
      MARIADB_DATABASE: gestiio
      MARIADB_USER: gestiio
      MARIADB_PASSWORD: GestiioNas2024!
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/db-import:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestiio-net

volumes:
  db-data:

networks:
  gestiio-net:
    driver: bridge
