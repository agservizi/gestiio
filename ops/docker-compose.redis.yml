# Redis standalone per Gestiio (cache + queue + presenza chat).
#
# Uso:
#   docker compose -f ops/docker-compose.redis.yml up -d
#
# Il servizio ascolta solo su 127.0.0.1:6379 (nessuna esposizione pubblica).
# Per collegarlo alla rete della compose principale di gestiio, valorizzare
# GESTIIO_NETWORK con il nome della rete esistente (es. gestiio_default) e
# impostare `external: true`. In alternativa lasciare la rete bridge dedicata.

services:
  redis:
    image: redis:7-alpine
    container_name: gestiio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - gestiio_redis:/data
    networks:
      - gestiio_redis_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  gestiio_redis:

networks:
  gestiio_redis_net:
    driver: bridge
    # Per agganciarsi alla rete della compose principale, sostituire con:
    # external: true
    # name: ${GESTIIO_NETWORK:-gestiio_default}
